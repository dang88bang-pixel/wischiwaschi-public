name: 🛡️ Build SecureGuard APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # gradlew ist self-bootstrapping (lädt Gradle 8.5 bei Bedarf selbst),
      # daher ist KEIN separater `gradle wrapper`-Schritt nötig.

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/secureguard-keystore.jks

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check NDK (optional)
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then echo "NDK: $(ls $ANDROID_HOME/ndk | head -1)"; else echo "NDK: nicht benötigt (kein natives C/C++)"; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secureguard-pro.apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: secureguard-pro.apk
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ SecureGuard Pro ${{ github.ref_name }}"
          body: |
            ## 🛡️ SecureGuard Enterprise

            ### ✅ Funktionen
            - 📡 LoRa/LoRaWAN
            - 🧠 Selbstlernender Agent
            - 🗺️ OpenStreetMap-Karte
            - 🎮 Fernsteuerung
            - 👁️ Optische Erkennung
            - 🌍 Apple/Google Crowdsourcing
            - 🏙️ Urbane Infrastruktur
            - 📡 GPS/GLONASS/Galileo
            - 🔒 DSGVO-konform

            ### 📦 Download
            - **APK**: secureguard-pro.apk
          files: |
            ./apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
